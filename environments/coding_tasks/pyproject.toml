[project]
name = "coding-tasks"
version = "0.1.0"
description = "Four scored Python test-generation tasks with deterministic mutation grading"
requires-python = ">=3.12,<3.14"
dependencies = ["verifiers==0.3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coding_tasks"]

[project]
name = "click-pilot"
version = "0.1.0"
description = "Click regression-test discovery pilot for Verifiers 0.3.1"
requires-python = ">=3.12,<3.14"
dependencies = ["verifiers==0.3.1", "prime-sandboxes==0.4.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["click_pilot"]

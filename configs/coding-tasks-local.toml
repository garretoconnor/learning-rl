# Example only: start a compatible local model server and replace its model ID.
# Dry-run validation makes no model calls.
model = "local-model"
num_tasks = 4
num_rollouts = 1
max_concurrent = 1
push = false

[env.taskset]
id = "coding-tasks"

[env.agent.harness]
id = "null"

[env.agent.runtime]
type = "subprocess"

[client]
base_url = "http://127.0.0.1:8000/v1"
api_key_var = "LOCAL_MODEL_API_KEY"

[sampling]
temperature = 0.0
max_tokens = 1024

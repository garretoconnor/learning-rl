# Start an Responses-compatible model server and set its model ID before a live run.
model = "local-model"
num_tasks = 1
num_rollouts = 1
max_concurrent = 1
push = false

[env.taskset]
id = "click-pilot"

[env.agent.harness]
id = "click-pilot"

[env.agent.runtime]
type = "subprocess"

[env.agent]
max_turns = 40

[client]
base_url = "http://127.0.0.1:8000/v1"
api_key_var = "LOCAL_MODEL_API_KEY"

[sampling]
temperature = 0.0
max_tokens = 4096
